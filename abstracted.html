<script>
    // FRAME RATE
    /**
     * Probe Chrome's own estimate of display pipeline depth.
     *
     * CAVEATS, in order of importance:
     *  - expectedDisplayTime is the browser's BELIEF about when a frame becomes
     *    visible, not a measurement. If Chrome's model omits a stage (e.g. an OS
     *    compositor pass), this omits it too.
     *  - This is the video element's path. A canvas captureStream source keeps it
     *    closer to canvas path than a decoded file would (no hardware overlay
     *    / direct-scanout shortcuts), but it is still not a canvas measurement.
     *  - The video must be rendered. display:none or zero size can suppress callbacks.
     *  - Ground truth needs a photodiode.
     *
     *  USEAGE:
     *  probePipelineDepth({ frameIntervalMs: 16.667 }).then(console.log)
     */
    async function probePipelineDepth({ frames = 60, frameIntervalMs = null } = {}) {
        if (!('requestVideoFrameCallback' in HTMLVideoElement.prototype)) {
            throw new Error('requestVideoFrameCallback not supported here');
        }

        // Source: a canvas we keep dirtying, captured as a MediaStream.
        // Avoids shipping a video asset and any codec/overlay weirdness.
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 32;
        const ctx = canvas.getContext('2d');

        const video = document.createElement('video');
        video.muted = true;        // required for autoplay without a gesture
        video.playsInline = true;
        Object.assign(video.style, {
            position: 'fixed', right: '0', bottom: '0', width: '32px', height: '32px',
            opacity: '0.02', pointerEvents: 'none', zIndex: '-1'
        });
        document.body.appendChild(video);

        video.srcObject = canvas.captureStream(60);
        await video.play();

        let drawing = true;
        (function paint() {                       // keep distinct frames flowing
            if (!drawing) return;
            ctx.fillStyle = `hsl(${(performance.now() / 4) % 360} 100% 50%)`;
            ctx.fillRect(0, 0, 32, 32);
            requestAnimationFrame(paint);
        })();

        const rows = [];
        await new Promise(resolve => {
            let n = 0;
            video.requestVideoFrameCallback(function tick(now, meta) {
                // `now` is the same clock/value an rAF callback would receive this turn
                rows.push({
                    displayLagMs:      meta.expectedDisplayTime - now,
                    nowToSubmitMs:     meta.presentationTime    - now,
                    submitToDisplayMs: meta.expectedDisplayTime - meta.presentationTime
                });
                ++n < frames ? video.requestVideoFrameCallback(tick) : resolve();
            });
        });

        drawing = false;
        video.srcObject.getTracks().forEach(t => t.stop());
        video.remove();

        const median = key => {
            const v = rows.map(r => r[key]).sort((a, b) => a - b);
            return v[Math.floor(v.length / 2)];
        };

        const displayLagMs = median('displayLagMs');
        return {
            samples: rows.length,
            displayLagMs,                                   // T -> photons, per Chrome
            nowToSubmitMs:     median('nowToSubmitMs'),     // T -> handed to compositor
            submitToDisplayMs: median('submitToDisplayMs'), // compositor -> visible
            depthInFrames: frameIntervalMs ? displayLagMs / frameIntervalMs : null
        };
    }

    // SETTINGS ------------
    const rdkSettings = {
        rdkRadius: 300,
        nDots: 17, // nDots per colour
        dotRadiusPix: 3,
        dotColours: ['black', 'lightgrey'],
        nTrials: 10,
        nBlocks: 3
    }



    // GLOBALS ------------
    let blockFrameInterval;
    let trialRunning = false; // This variable is slight overkill but double protects against requestAnimationFrame trying to paint after trial ends.

    // DEFINE TRIALS - pre-calculate dot coordinates ------------

    // TODO: pre-draw on canvas and visibility change during trial or graphics blit to image?
    function getRandomRDKCoordinates() {
        // size of circle, the colour and size of dots, length of time
        const rdkCentre = {x: rdkSettings.rdkRadius, y: rdkSettings.rdkRadius};
        // DEBUGGING - draw outline of rdk circle and outer box
        // drawCanvasOutline(c, ctx) // DEBUG
        // drawRDKOutline(ctx, rdkCentre, rdkRadius); //DEBUG

        const dots = [] // Store dot coordinates to check intersection
        for(let i = 0; i < rdkSettings.nDots*rdkSettings.dotColours.length; i++){
            // Get new non-overlapping dot
            let newDot = getRandomDotCoordinates(rdkCentre, rdkSettings.rdkRadius-rdkSettings.dotRadiusPix);
            let detectedIntersections = 0
            while (intersectsExistingDot(newDot, dots, rdkSettings.dotRadiusPix)) {
                detectedIntersections++
                if(detectedIntersections > 50) { // TODO: Consider removing this check - but it protects against a page crash when trying things out
                    console.error(`Detected ${detectedIntersections} intersections with existing dots, exiting to avoid crash - maybe dots can't fit inside circle?`)
                    throw new Error('Dots cannot fit inside circle');
                }
                newDot = getRandomDotCoordinates(rdkCentre, rdkSettings.rdkRadius);
            }
            // console.log(detectedIntersections + ' intersections detected on dot ' + i)
            dots.push(newDot);
        }
        return dots;
    }

    // Create array of random dot coordinates
    function getRandomDotCoordinates(centre, radius){
        const randomRadians = Math.random() * 2 * Math.PI;
        // TODO: note dot centre is within circle bounds - so can poke but by dot radius;
        const randomDistance = Math.sqrt(Math.random()); // 0=centre, 1=circumference
        return {
            x: centre.x + radius * Math.cos(randomRadians) * randomDistance,
            y: centre.y + radius * Math.sin(randomRadians) * randomDistance
        };
    }

    function circlesIntersect(centreA, centreB, dotRadius){
        //https://www.geeksforgeeks.org/dsa/check-two-given-circles-touch-intersect/
        // Find the distance between the centers.
        const dist = Math.sqrt((centreA.x-centreB.x)**2 + (centreA.y-centreB.y)**2);
        // Check whether the circles have at least one common point.
        return dist < dotRadius*2;
    }

    function intersectsExistingDot(newDot, previousDots, dotRadius){
        const nPreviousDots = previousDots.length;
        for(let i = 0; i < nPreviousDots; i++){
            if(circlesIntersect(newDot, previousDots[i], dotRadius)){
                // console.log(`${nPreviousDots+1} intersected with dot ${i+1}`); // DEBUG
                return true
            }
        }
        return false;
    }

    // FRAME RATE --------------------
    const measureFrameInterval = async function (nFrames = 120, warmup = 20) {
        console.log('Measuring frame rate...')
        // Note Chrome quantises DOMHighResTimeStamps to 0.1ms grid unless page is cross-origin isolated
        // e.g. 16.6667 will be as 16.7 = 59.88 FPS when 60FS
        // Must serve not-cross origin (GitHub Pages doesn't do this) for slightly better timestamps
        // Don't be fooled by floating point issues giving many significant figures.

        // Store frames
        const ts = [];
        const executionLag = []; // these are a main-thread scheduling lag / render depth proxy by seeing when callback is actually run
        let frameCountGuard = 0;
        let nSamples = 0;
        await new Promise(res => { // could probably do this with a loop somehow
            function tick(t) {
                if(frameCountGuard < warmup + nFrames){
                    if(frameCountGuard >= warmup){
                        ts.push(t);
                        executionLag.push(performance.now() - t);
                        nSamples++;
                    }
                    requestAnimationFrame(tick)
                } else res()
                frameCountGuard++
            }
            requestAnimationFrame(tick);
        });

        // Get median
        const differences = [];
        for (let i=1; i < ts.length; i++) differences.push(ts[i] - ts[i-1]); // calculate frame time differences
        console.log(differences)
        differences.sort((a, b) => a - b); // sort frame times
        const middleIndex = Math.floor(differences.length / 2)
        const median = differences[middleIndex];

        // TESTING OTHER STATS
        // Mean
        const mean = (ts[ts.length-1]-ts[0]) / (ts.length-1) // n-1 gaps between timestamps

        // Robust mean - taking into account double gaps where a frame was lost
        let nIntervals = 0;
        for (let i=1; i < ts.length; i++) nIntervals += Math.round((ts[i] - ts[i-1]) / median)
        const robustMean = (ts[ts.length-1]-ts[0]) / nIntervals

        // Median Absolute Deviation
        // should be about .1 if quantisation on
        const medianAbsoluteDeviation = differences.map(x => Math.abs(x - median)).sort((a, b) => a - b)[middleIndex];

        // On executionLag:
        executionLag.sort((a, b) => a - b);   // numeric sort; JS defaults to lexicographic
        // console.log({ min: executionLag[0], median: executionLag[middleIndex], max: executionLag[executionLag.length-1] });
        // Other stats

        const frameStats = { median, FPS: 1000 / median, mean, robustMean, medianAbsoluteDeviation, nSamples, nIntervals, differences, maxExecutionLag: executionLag[executionLag.length-1]};
        console.log(frameStats);
        return frameStats;
    }

    const setFrameInterval = async function (done) {
        const res = await measureFrameInterval();
        blockFrameInterval = res;
        done(res);
    }

    const measureFrameRateTrial = {
        type: jsPsychCallFunction, // see https://www.jspsych.org/v8/plugins/call-function/
        func: setFrameInterval,
        async: true
    }

    // RDK -------------------

    // For debugging - make sure dots are inside circle
    function drawRDKOutline(ctx, centre, radius){
        ctx.beginPath();
        ctx.arc(centre.x, centre.y, radius, 0, 2 * Math.PI);
        ctx.stroke();
    }

    function drawCanvasOutline(c, ctx){
        ctx.beginPath();
        ctx.rect(0, 0, c.width, c.height);
        ctx.stroke();
    }

    function drawDots(ctx, dots, dotSize, colour, from, to, label) {
        ctx.fillStyle = colour;
        ctx.beginPath();
        for (let i = from; i < to; i++) {
            const dot = dots[i];
            ctx.moveTo(dot.x + dotSize, dot.y);   // required, or arcs get joined by lines
            ctx.arc(dot.x, dot.y, dotSize, 0, 2 * Math.PI);
            // Optional label for debugging
            if(label !== undefined){
                ctx.font = `${dotSize*2}px sans-serif`;
                ctx.fillStyle = 'lightgrey'
                const textSize = ctx.measureText(label).width/2;
                ctx.fillText(label, dot.x-textSize, dot.y+textSize); //dot.x-(textSize.width/2), dot.y-(textSize.height/2)
            }
        }
        ctx.fill();
    }


    function drawRDK(ctx, dotCoordinates, frameNumber){
        if(frameNumber > 0) return
        rdkSettings.dotColours.forEach((colour, c) => {
            const from = c * rdkSettings.nDots;
            drawDots(ctx, dotCoordinates, rdkSettings.dotRadiusPix, colour, from, from + rdkSettings.nDots);
        });
    }

    function finishTrial(startTime, endTime, requestedDuration, frameNumber, callingFunction){
        const durationError = (endTime-startTime)-requestedDuration
        console.log(`Duration error: ${requestedDuration}, ${durationError.toFixed(4)}ms`, callingFunction)
        jsPsych.finishTrial({
            startTime,
            endTime,
            nFrames: frameNumber, // NOTE: number of RAF callbacks (browser frames), not = number of screen refreshes if any frames were dropped.
        });
    }


    // PRE-RENDERING DOTS - NOTE need to test, fully believe this is actually slower - MAYBE a pre-render on the entire thing would be quicker though.
    // general shape if thinking about pre-rendering and blitting
    // async function makeDotSprite(colour, rPix, dpr = devicePixelRatio) {
    //     const s = Math.ceil(rPix * 2 * dpr) + 2;           // supersample to DPR
    //     const off = new OffscreenCanvas(s, s);             // no Worker — just a buffer
    //     const c = off.getContext('2d');
    //     c.fillStyle = colour;
    //     c.beginPath();
    //     c.arc(s / 2, s / 2, rPix * dpr, 0, 2 * Math.PI);
    //     c.fill();
    //     return await createImageBitmap(off);               // decoded off-thread, cached & reused
    // }

    // onset — blit sprites (reuses the cached bitmaps, does not consume them):
    // Stateless: stamp each dot's sprite at its current position. No motion logic here.
    // function drawField(ctx, dots, sprites) {
    //     for (const d of dots) {
    //         const s = sprites[d.c]; // Store colour with dots and then store sprites in array
    //         ctx.drawImage(s.bitmap, d.x - s.r, d.y - s.r, s.r * 2, s.r * 2);
    //     }
    // }

    // function advanceDots(dots, motion, aperture) {
    //     const { cx, cy, R } = aperture;                 // circular aperture
    //     for (const d of dots) {
    //         if (d.signal) {                             // coherent "signal" dots share one velocity
    //             d.x += motion.vx;
    //             d.y += motion.vy;
    //         } else {                                    // "noise" dots — random walk (one of several standard schemes)
    //             const a = Math.random() * 2 * Math.PI;
    //             d.x += Math.cos(a) * motion.speed;
    //             d.y += Math.sin(a) * motion.speed;
    //         }
    //         const dx = d.x - cx, dy = d.y - cy;         // re-entry: a dot leaving the aperture comes back in
    //         if (dx * dx + dy * dy > R * R) {            // (here: reflect through centre; limited-lifetime/random-replot also common)
    //             d.x = cx - dx;

    //         }
    //     }

    // STATIC VERSION
    // // setup (once, awaited, during ISI):
    // const sprites = await Promise.all(
    //     rdkSettings.dotColours.map(col => makeDotSprite(col, rdkSettings.dotRadiusPix))
    // );
    // const dots = getRandomRDKCoordinates();   // each dot given a .c colour index
    //
    // // in the trial — this is your onFrame:
    // runRAFLoop(canvas, trialDuration, (canvas, ctx, t, frameNumber) => {
    //     if (frameNumber === 0) drawField(ctx, dots, d => sprites[d.c]);  // draw once; frames 1..N are no-ops
    // }, finishTrial);

    // MOVING VERSION
    // // setup adds velocity + a signal/noise flag per dot; sprites built exactly as before.
    // runRAFLoop(canvas, trialDuration, (canvas, ctx, t, frameNumber) => {
    //     ctx.clearRect(0, 0, wCss, hCss);           // wipe previous frame
    //     advanceDots(dots, motion, aperture);       // evolve state — the actual RDK algorithm
    //     drawField(ctx, dots, d => sprites[d.c]);    // blit the SAME sprites at NEW positions
    // }, finishTrial);


    // -*------------------------------------------------------
    function runRAFLoop({
            canvas,
            duration,
            onFrame, // drawing function called each frame - note timestamps are off from startTime and endTime. pass empty to just time.
            onFinish, // (data) => void
            hideStimulus = (c, x) => x.clearRect(0, 0, c.width, c.height), // User could do visibility or opacity

            // Work in progress for inter-frame interval estimates TODO: rename to frameInterval, adaptiveWindow
            estimatedFrameInterval = null, // TODO: either pass in pre-calculated value, or pre-existing warmup frames array maybe?
            preTrialFrameIntervals = null, // TODO: remove? unsure it does much beyond just seeding everything at median estimate
            adaptiveWindow = 20, // or use duration and frameRate to estimate?
            guardFrames = 1.5, // to always round up or down.
            nFrames, // but note that screens differ in the wild - users can pre-calculate nFrames using refresh though.
            timeout = false,
            onVisibilityChange = null
        }={}) {
        // TODO: consider generalising to work with non-canvas stim, hiding with visibility or opacity if not
        // TODO: consider generalising to use requestVideoFrameCallback for videos too?
        let frameInterval = estimatedFrameInterval, finished = false, frameNumber = 0, ctx = canvas.getContext('2d');
        let startTime = null, lastFrameTime = null, previousCallbackEndTimestamp = null;
        let animationId = null, timeoutId = null;

        // frame interval arrays for median calculation
        const frameIntervals = new Array(adaptiveWindow);
        let writeHead = 0;
        const sortedIntervals = new Array(adaptiveWindow);

        if (estimatedFrameInterval != null && adaptiveWindow > 0){
            frameIntervals.fill(estimatedFrameInterval)
            writeHead = adaptiveWindow;
        }

        if(preTrialFrameIntervals !== null && adaptiveWindow > 0) {
            for (let i = 0; i < preTrialFrameIntervals.length; i++) {
                frameIntervals[i % adaptiveWindow] = preTrialFrameIntervals[i]
            }
            writeHead = Math.min(preTrialFrameIntervals.length, adaptiveWindow)
        }


        // cancel function
        function cancel() {
            finished = true;
            if (animationId) cancelAnimationFrame(animationId)
            if (timeoutId) clearTimeout(timeoutId);
            animationId = null;
            timeoutId = null;
            document.removeEventListener('visibilitychange', visibilityChangeHandler);
            window.removeEventListener('blur', visibilityChangeHandler);
            window.removeEventListener('focus', visibilityChangeHandler);
            hideStimulus(canvas, ctx)
        }

        function runTimeoutBackup(startTime){
            //  backup for RAF onBlur issue,
            //  TODO: although why end trial user can't see? may as well record issue. but need to distinguish code execution lag from blur
            timeoutId = setTimeout(() => {
                if(finished) return
                cancel()
                const endTime = performance.now();
                if(onFinish) onFinish(startTime, endTime, duration, frameNumber, 'setTimeout')
            }, duration+(frameInterval*2.5)) // frameInterval may be null though
        }

        function visibilityChangeHandler(event) {
            // Enough info that user can end trial if they want
            if(onVisibilityChange) onVisibilityChange({
                event,
                type: event.type,
                eventTimeStamp: event.timeStamp,
                documentVisibilityState: document.visibilityState,
                documentHiddenState: document.hidden,
                trialStartTime: startTime,
                currentTime: performance.now(),
                trialDuration: duration,
                frameNumber
            })
            // TODO: decide what to do with this information?
            // cancel();                       // stop now; don't rely on rAF resuming
            // if(onFinish) onFinish(startTime, performance.now(), duration, frameNumber, 'visibilityHidden', droppedFrames);
        }

        // Calculating median
        function pushInterval(interval){
            frameIntervals[writeHead % adaptiveWindow] = interval
            writeHead++
        }

        function median(){
            // TODO: consider streaming median with two heaps or "sliding-window median", LeetCode 480
            // TODO: consider accounting for dropped frames with robustMean as above
            for(let i=0; i<adaptiveWindow; i++) sortedIntervals[i] = frameIntervals[i];
            sortedIntervals.sort((a, b) => a - b); // sort frame times
            // Return middle of array even if not full if no estimatedFrameInterval exists
            const filledArrayIndex = Math.min(writeHead, adaptiveWindow)
            const middle = Math.floor(filledArrayIndex/2)
            return sortedIntervals[middle];
        }

        function getFrameInterval(interval){
            if (adaptiveWindow === 0) return estimatedFrameInterval ?? interval;
            return median();
        }

        function endAnimationFrame(endTime){
            if (finished) return;
            finished = true;
            animationId = null;
            // setTimeout allows endTrial to leave render cycle and run on normal event loop after current frame's paint, incase causes overrun
            setTimeout(() => {
                onFinish(startTime, endTime, duration, frameNumber, 'rAF')
            }, 0)
        }

        function tick(timestamp){
            if(finished) { cancel(); return; }
            frameNumber++;

            // frame interval estimation
            const currentFrameInterval = timestamp-lastFrameTime
            if (frameInterval == null || currentFrameInterval < frameInterval * 2.5) {
                pushInterval(currentFrameInterval);
            }
            frameInterval = getFrameInterval(currentFrameInterval)

            // Estimate if stim should end
            // console.log('Time since last execute: ', (timestamp - previousCallbackEndTimestamp).toFixed(4))
            // TODO: consider recording maxFrameGapMs, dropped/slow frames, maxFrameGapMs, jsPsych.data.getInteractionData() or focus event listener
            if ((!nFrames && timestamp - startTime + (frameInterval * guardFrames) < duration) || (nFrames && frameNumber <= nFrames)) {
                onFrame(canvas, ctx, duration, timestamp, frameNumber)
                animationId = requestAnimationFrame(tick)
            } else {
                hideStimulus(canvas, ctx)
                animationId = requestAnimationFrame(endAnimationFrame);   // clear becomes visible when this fires
            }
            lastFrameTime = timestamp // placement of this? could carry through in args?
            // previousCallbackEndTimestamp = performance.now(); // TODO: could function as some measure of likelihood frame pain was reached? maybe alongside a rVFC?
            // console.log('Time to execute: ', (previousCallbackEndTimestamp - timestamp).toFixed(4))
        }

        animationId = requestAnimationFrame((firstTimestamp) => {
            // TODO: could just gate this on frameNumber=0
            if(finished) { cancel(); return; }
            // First draw
            onFrame(canvas, ctx, duration, firstTimestamp, frameNumber)
            lastFrameTime = firstTimestamp
            animationId = requestAnimationFrame(firstCallbackTimestamp => { // frame 1 drawn
                startTime = firstCallbackTimestamp;
                if(timeout) runTimeoutBackup(startTime)
                tick(firstCallbackTimestamp)
            })

            // previousCallbackEndTimestamp = performance.now();
        })

        if(onVisibilityChange) {
            document.addEventListener('visibilitychange', visibilityChangeHandler);
            window.addEventListener('blur', visibilityChangeHandler);
            window.addEventListener('focus', visibilityChangeHandler);
        }

        return cancel;
    }









    // -*------------------------------------------------------


    const rdkTrial = {
        type: jsPsychCanvasKeyboardResponse,
        canvas_size: [rdkSettings.rdkRadius*2, rdkSettings.rdkRadius*2], // Canvas fit to RDK
        stimulus: (c)=>{
            // const dots = getRandomRDKCoordinates() // Note: use this if you want to just calculate dot coordinates before each trial
            const dots = jsPsych.evaluateTimelineVariable('dotCoordinates') //https://www.jspsych.org/v8/reference/jspsych/#description_4
            const trialDuration = jsPsych.evaluateTimelineVariable('trialDuration')
            const cancel = runRAFLoop({
                canvas: c,
                duration: trialDuration,
                onFrame: (canvas, ctx, duration, firstTimestamp, frameNumber)=>{drawRDK(ctx, dots, frameNumber)},
                onFinish: finishTrial,
                estimatedFrameInterval: blockFrameInterval.median,        // estimatedFrameInterval  (scalar fallback)
                // preTrialFrameIntervals: blockFrameInterval.differences,
                adaptiveWindow: 20, // or use duration and frameRate to estimate?
                // nFrames: Math.round(trialDuration / blockFrameInterval.robustMean.toFixed(3))
                // visibilityChange: false
            })
        },
        choices: "NO_KEYS",
        // https://www.jspsych.org/v8/tutorials/rt-task/#part-8-using-functions-to-generate-parameters
        // trial_duration: function() {return jsPsych.evaluateTimelineVariable('trialDuration') + rdkSettings.overshootAmountMs},
        on_start: () => {
            trialRunning = true //TODO: Nice to have this global but breaks containment from runRAFLoop and slightly duplicates `finished` from there
        },
        on_finish: () => {
            trialRunning = false;
            // stopRAF();
            // console.log('jsPsych ended trial');
        }}

    // TIMELINE  --------------------
    // Pre-calculate dot coordinates for all blocks - have construct entire timeline each trial at a time as can't loop
    function makeTimeline(){
        const timeline = []

        for(let i = 0; i < rdkSettings.nBlocks; i++){
            // NOTE: if you want displayed times consistent, we'd need to use durations that are multiples of the frame rate, or display a number of frames directly
            const trialDurations = [1000, 1111, 1222, 1333, 1444, 1555, 1666, 1777, 1888, 1999];
            timeline.push({ // Nested timeline makes the frameInterval at the start of the block
                timeline: [measureFrameRateTrial],
            })
            const blockTrials = {
                timeline: [rdkTrial],
                timeline_variables: []
            }
            for(let c = 0; c < rdkSettings.nTrials; c++){
                // Pick a random duration in milliseconds from the array
                // const trialLength = trialDurations.splice(Math.random()*(trialDurations.length-1))[0]; // To sample without replacement, but must be enough elements to sample from
                const trialDuration = trialDurations[c%trialDurations.length]//Math.floor(Math.random() * trialDurations.length)]
                blockTrials.timeline_variables.push({
                    dotCoordinates: getRandomRDKCoordinates(),
                    //https://www.jspsych.org/v8/tutorials/rt-task/#part-8-using-functions-to-generate-parameters
                    trialDuration: trialDuration
                })
            }
            timeline.push(blockTrials)
        }
        console.log(timeline)
        return timeline
    }

    // RUN JSPSYCH  --------------------
    const jsPsych = initJsPsych();
    const timeline = makeTimeline();
    jsPsych.run(timeline);
</script>
