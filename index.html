<!DOCTYPE html>
<html>
<head>
    <title>My experiment</title>
    <script src="https://unpkg.com/jspsych@8.3.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@2.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
</head>
<body></body>
<script>

    const rdkSettings = {
        rdkRadius: 300,
        nDots: 17,
        dotRadiusPix: 3,
        dotColour: 'black',
        trialDuration: 3000
    }

    // initialize jsPsych
    const jsPsych = initJsPsych();
    const timeline = [];

    const measureFrameInterval = async function (nFrames = 120, warmup = 20) {
        // Store frames
        const ts = [];
        await new Promise(res => {
            function tick(t) {
                ts.push(t);
                ts.length < nFrames + warmup ? requestAnimationFrame(tick) : res();
            }
            requestAnimationFrame(tick);
        });

        // Get median and MAD
        const d = [];
        for (let i = warmup+1; i < ts.length; i++) d.push(ts[i] - ts[i-1]);
        d.sort((a, b) => a - b);
        const median = d[Math.floor(d.length / 2)];
        // calc error: Median Absolute Deviation
        const mad = d.map(x => Math.abs(x - median)).sort((a, b) => a - b)[d.length >> 1];

        console.log(median);
        return { median, mad, hz: 1000 / median };
    }

    let frameInterval;
    const setFrameInterval = async function (done) {
        const res = await measureFrameInterval();
        frameInterval = res;
        done(res);
    }

    const frameIntervalTrial = {
        type: jsPsychCallFunction, // see https://www.jspsych.org/v8/plugins/call-function/
        func: setFrameInterval,
        async: true
    }

    // RDK drawing
    let animationID;
    let trialRunning = false; // This variable is slight overkill but double protects against requestAnimationFrame trying to paint after trial ends.

    function drawRDK(c, rdkRadius, nDots, dotSize, colour='black'){
        const ctx = c.getContext('2d');
        if(!trialRunning) {
            stopRAF()
            hideStimulus(c, ctx)
            return;
        }

        // size of circle, the colour and size of dots, length of time
        const rdkCentre = {x: c.width/2, y: c.height/2};
        // DEBUGGING - draw outline of rdk circle and outer box
        // drawCanvasOutline(c, ctx) // DEBUG
        // drawRDKOutline(ctx, rdkCentre, rdkRadius); //DEBUG

        const dots = [] // Store dot coordinates to check intersection
        for(let i = 0; i < nDots; i++){
            // Get new non-overlapping dot
            let newDot = getRandomDotCoordinates(rdkCentre, rdkRadius);
            let detectedIntersections = 0
            while (intersectsExistingDot(newDot, dots, dotSize)) {
                detectedIntersections++
                if(detectedIntersections >= 50) { // TODO: Consider removing this check - but it protects against a page crash when trying things out
                    console.error(`Detected ${detectedIntersections} intersections with existing dots, exiting to avoid crash - maybe dots can't fit inside circle?`)
                    throw Error();
                }
                newDot = getRandomDotCoordinates(rdkCentre, rdkRadius);
            }
            // console.log(detectedIntersections + ' intersections detected on dot ' + i)
            dots.push(newDot);
            drawPoint(ctx, newDot, dotSize, colour, i+1);
        }

        // Arm frame loop - note stim is static so doesn't need redrawing
        // Pass start time from here, as we want actual draw from previous frame defined above
        // previousTs passed in as startTime for first go, so difference is 0
        animationID = requestAnimationFrame(startTime => checkStimTime(startTime, startTime, c, ctx))
    }

    function checkStimTime(previousTs, startTime, c, ctx){
        const elapsedTimeAtNextFrame = (previousTs + frameInterval.median) - startTime;
        if (animationID && elapsedTimeAtNextFrame < rdkSettings.trialDuration - frameInterval.median/2) {
            animationID = requestAnimationFrame(previousTs => checkStimTime(previousTs, startTime, c, ctx))
        } else {
            stopRAF()
            hideStimulus(c, ctx)
            // console.log('Canvas cleared by Request Animation Frame')
        }
    }

    function stopRAF() {
        if (animationID) {
            cancelAnimationFrame(animationID)
            animationID = undefined
        }
    }

    function hideStimulus(canvas, ctx){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // For debugging - make sure dots are inside circle
    function drawRDKOutline(ctx, centre, radius){
        ctx.beginPath();
        ctx.arc(centre.x, centre.y, radius, 0, 2 * Math.PI);
        ctx.stroke();
    }

    function drawCanvasOutline(c, ctx){
        ctx.beginPath();
        ctx.rect(0, 0, c.width, c.height);
        ctx.stroke();
    }


    function getRandomDotCoordinates(centre, radius){
        const randomRadians = Math.random() * 2 * Math.PI; // or 359?
        const randomDistance = Math.sqrt(Math.random()); // 0=centre, 1=circumference // TODO: note dot centre is within circle bounds - so can poke but by dot radius;
        return {
            x: centre.x + radius * Math.cos(randomRadians) * randomDistance,
            y: centre.y + radius * Math.sin(randomRadians) * randomDistance
        };
    }

    function circlesIntersect(centreA, centreB, dotRadius){
        //https://www.geeksforgeeks.org/dsa/check-two-given-circles-touch-intersect/
        // Find the distance between the centers.
        const dist = Math.sqrt((centreA.x-centreB.x)**2 + (centreA.y-centreB.y)**2);
        // Check whether the circles have at least one common point.
        return dist < dotRadius*2;
    }

    function intersectsExistingDot(newDot, previousDots, dotRadius){
        const nPreviousDots = previousDots.length;
        for(let i = 0; i < nPreviousDots; i++){
            if(circlesIntersect(newDot, previousDots[i], dotRadius)){
                // console.log(`${nPreviousDots+1} intersected with dot ${i+1}`); // DEBUG
                return true
            }
        }
        return false;
    }

    function drawPoint(ctx, dot, dotSize, colour='black', label){
        // https://stackoverflow.com/questions/32681610/drawing-point-on-circle
        ctx.fillStyle = colour;
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dotSize, 0, 2 * Math.PI);
        ctx.fill();

        // Optional label for debugging
        // if(label !== undefined){
        //     ctx.font = `${dotSize*2}px sans-serif`;
        //     ctx.fillStyle = 'lightgrey'
        //     const textSize = ctx.measureText(label).width/2;
        //     ctx.fillText(label, dot.x-textSize, dot.y+textSize); //dot.x-(textSize.width/2), dot.y-(textSize.height/2)
        // }
    }

    const rdkTrial = {
        type: jsPsychCanvasKeyboardResponse,
        canvas_size: [rdkSettings.rdkRadius*2, rdkSettings.rdkRadius*2], // Canvas fit to RDK
        stimulus: async (c)=>{
            animationID = requestAnimationFrame(() => {
                drawRDK(c, rdkSettings.rdkRadius, rdkSettings.nDots, rdkSettings.dotRadiusPix, rdkSettings.dotColour)
            })
        },
        choices: "NO_KEYS",
        trial_duration: rdkSettings.trialDuration + 500, // Note this starts earlier than my version and would fire too early too - make too long for accurate display times.
        on_start: () => {
            trialRunning = true
        },
        on_finish: () => {
            trialRunning = false;
            stopRAF();
            // console.log('Canvas cleared by trial_duration (jsPsych)');
        }
        // data: {key: 'value'}
    }

    /* define trial stimuli array for timeline variables */ // TODO: this is how you define trial vars
    // const test_stimuli = [{ key: 'value'},];

    /* define test procedure */
    const rdkTrialsTimeline = {
        timeline: [rdkTrial],
        // timeline_variables: test_stimuli,
        repetitions: 5,
        // randomize_order: true
    };

    const blocks = {
        timeline: [frameIntervalTrial, rdkTrialsTimeline],
        repetitions: 5,
    };

    timeline.push(blocks);

    jsPsych.run(timeline);


</script>
</html>
